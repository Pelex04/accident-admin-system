<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Overview - Accident Detection Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <div class="main">
    <div class="page-header">
      <div>
        <h1>Overview</h1>
        <p>Fleet status across every registered vehicle.</p>
      </div>
    </div>

    <div class="page-body">
      <div class="kpi-grid" id="kpis"></div>

      <div class="section">
        <div class="section-title">
          <h2>Needs attention</h2>
        </div>
        <div id="alertsContainer"><div class="empty-state">Loading alerts...</div></div>
      </div>

      <div class="section">
        <div class="section-title">
          <h2>Recent crash events</h2>
          <span class="count"><a href="events.html">View all</a></span>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>Vehicle</th>
              <th>Detected</th>
              <th>Status</th>
              <th>Location</th>
            </tr>
          </thead>
          <tbody id="eventsTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/dropdown.js"></script>
<script src="js/table-tools.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
