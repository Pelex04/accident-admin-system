<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Live board - Accident Detection Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/live.css">
</head>
<body>
<div class="layout">
  <div class="main">
    <div class="page-header">
      <div>
        <h1>Live board</h1>
        <p>Crashes as they happen. Keep this page open.</p>
      </div>
      <div>
        <button type="button" class="btn secondary" id="soundButton">Turn sound on</button>
      </div>
    </div>

    <div class="page-body">
      <div class="conn warn" id="conn" role="status">Connecting...</div>
      <div class="sr-only" id="announce" aria-live="assertive"></div>
      <div id="baseBar" class="basebar"></div>
      <div id="board"></div>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/qrcode.js"></script>
<script src="js/live.js"></script>
</body>
</html>
