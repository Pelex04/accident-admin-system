<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Crash events - Accident Detection Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <div class="main">
    <div class="page-header">
      <div>
        <h1>Crash events</h1>
        <p>Every detection reported by the field devices.</p>
      </div>
      <div>
        <select id="statusFilter" style="width: 200px">
          <option value="">All statuses</option>
          <option value="detected">Detected</option>
          <option value="countdown">Countdown</option>
          <option value="cancelled">Cancelled</option>
          <option value="alert_sent">Alert sent</option>
          <option value="alert_failed">Alert failed</option>
        </select>
      </div>
    </div>

    <div class="page-body">
      <div class="section">
        <table class="data-table">
          <thead>
            <tr>
              <th data-filter>Vehicle</th>
              <th>Detected</th>
              <th>Status</th>
              <th>Location</th>
              <th>Notes</th>
              <th data-noexport>Update</th>
            </tr>
          </thead>
          <tbody id="eventsTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/dropdown.js"></script>
<script src="js/events.js"></script>
<script src="js/table-tools.js"></script>
<script src="js/bulk.js"></script>
<script>
enhanceTable(document.getElementById("eventsTableBody").closest("table"), { name: "crash events", dates: true });
enableBulk(document.getElementById("eventsTableBody").closest("table"), {
  noun: "crash events",
  actions: ["detected", "countdown", "cancelled", "alert_sent", "alert_failed"].map((s) => ({ value: s, label: "Set to " + s.replace(/_/g, " ") })),
  apply: (id, status) => api.updateEvent(id, { status }),
  reload: () => loadEvents()
});
</script>
</body>
</html>
