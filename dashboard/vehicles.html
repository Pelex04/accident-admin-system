<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Vehicles - Accident Detection Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <div class="main">
    <div class="page-header">
      <div>
        <h1>Vehicles</h1>
        <p>Every registered device and its emergency contacts.</p>
      </div>
      <div><button type="button" class="btn secondary" id="importVehicles">Import CSV</button></div>
    </div>

    <div class="page-body">
      <div class="section">
        <div class="section-title">
          <h2>Registered vehicles</h2>
          <span class="count" id="vehicleCount"></span>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>Vehicle</th>
              <th>SIM number</th>
              <th data-filter>Status</th>
              <th>Registered</th>
              <th>Contacts</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="vehiclesTableBody"></tbody>
        </table>
      </div>

      <div class="section" style="max-width: 420px">
        <div class="section-title">
          <h2>Add a vehicle</h2>
        </div>
        <div class="card">
          <div class="form-row">
            <label for="newName">Name</label>
            <input type="text" id="newName" placeholder="Driver name or plate number">
          </div>
          <div class="form-row">
            <label for="newSim">Arduino SIM number</label>
            <input type="text" id="newSim" placeholder="+265991234567">
          </div>
          <div class="error-text" id="addError"></div>
          <button class="btn" id="addVehicleButton">Add vehicle</button>
        </div>
      </div>

      <div class="section" id="contactsSection" style="display: none; max-width: 560px">
        <div class="section-title">
          <h2 id="contactsTitle">Contacts</h2>
        </div>
        <div class="card">
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Phone number</th>
                <th data-filter>Priority</th>
                <th data-filter>Role</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="contactsTableBody"></tbody>
          </table>
          <div class="form-row" style="margin-top: 16px">
            <label for="contactName">New contact name</label>
            <input type="text" id="contactName" placeholder="Name">
          </div>
          <div class="form-row">
            <label for="contactPhone">New contact phone number</label>
            <input type="text" id="contactPhone" placeholder="+265888111222">
          </div>
          <div class="form-row">
            <label for="contactRole">Role</label>
            <select id="contactRole">
              <option value="next_of_kin">Next of kin</option>
              <option value="dispatcher">Medical dispatcher</option>
            </select>
          </div>
          <div class="error-text" id="contactError"></div>
          <button class="btn" id="addContactButton">Add contact</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/dropdown.js"></script>
<script src="js/vehicles.js"></script>
<script src="js/table-tools.js"></script>
<script src="js/bulk.js"></script>
<script>
enhanceTable(document.getElementById("vehiclesTableBody").closest("table"), { name: "vehicles", dates: true });
enhanceTable(document.getElementById("contactsTableBody").closest("table"), { name: "contacts" });

enableBulk(document.getElementById("vehiclesTableBody").closest("table"), {
  noun: "vehicles",
  actions: [{ value: "active", label: "Activate" }, { value: "inactive", label: "Deactivate" }, { value: "delete", label: "Delete", danger: true }],
  apply: (id, value) => (value === "delete" ? api.deleteVehicle(id) : api.updateVehicle(id, { status: value })),
  reload: () => loadVehicles()
});

const digits = (v) => String(v).replace(/[\s()-]/g, "");
const phoneOk = (v) => /^\+?\d[\d\s()-]{6,18}$/.test(v);

document.getElementById("importVehicles").addEventListener("click", async () => {
  let existing = new Set();
  try { existing = new Set((await api.getVehicles()).map((v) => digits(v.arduinoSimNumber))); } catch (err) { /* checked again by the server */ }
  openImport({
    title: "Import vehicles",
    columns: [
      { key: "name", label: "name", required: true, aliases: ["vehicle", "plate", "drivername"] },
      { key: "arduinoSimNumber", label: "SIM number", required: true, aliases: ["sim", "simnumber", "phone", "phonenumber"] }
    ],
    template: [["name", "SIM number"], ["Driver or plate number", "+265991234567"]],
    check: (r, seen) => {
      if (!phoneOk(r.arduinoSimNumber)) return "SIM number looks invalid";
      const key = digits(r.arduinoSimNumber);
      if (existing.has(key)) return "SIM number is already registered";
      if (seen.has(key)) return "SIM number is repeated in this file";
      seen.add(key);
      return null;
    },
    run: (r) => api.createVehicle({ name: r.name, arduinoSimNumber: r.arduinoSimNumber }),
    done: () => loadVehicles()
  });
});

const contactsTitleBar = document.querySelector("#contactsSection .section-title");
const importContacts = document.createElement("button");
importContacts.type = "button";
importContacts.className = "btn secondary";
importContacts.textContent = "Import CSV";
contactsTitleBar.appendChild(importContacts);
importContacts.addEventListener("click", () => {
  const vehicleId = selectedVehicleId;
  if (!vehicleId) return;
  openImport({
    title: "Import contacts",
    columns: [
      { key: "name", label: "name", required: true },
      { key: "phoneNumber", label: "phone number", required: true, aliases: ["phone", "number"] },
      { key: "priority", label: "priority", required: false }
    ],
    template: [["name", "phone number", "priority"], ["Contact name", "+265888111222", "1"]],
    check: (r, seen) => {
      if (!phoneOk(r.phoneNumber)) return "Phone number looks invalid";
      if (r.priority && !/^[1-9]\d?$/.test(r.priority)) return "Priority must be a whole number from 1 to 99";
      const key = digits(r.phoneNumber);
      if (seen.has(key)) return "Phone number is repeated in this file";
      seen.add(key);
      return null;
    },
    run: (r) => api.addVehicleContact(vehicleId, { name: r.name, phoneNumber: r.phoneNumber, priority: Number(r.priority) || 1 }),
    done: async () => {
      await loadVehicles();
      const button = document.querySelector("[data-action='contacts'][data-id='" + vehicleId + "']");
      if (button) button.click();
    }
  });
});
</script>
</body>
</html>
