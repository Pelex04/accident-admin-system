<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change password - Accident Detection Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<main class="auth" style="grid-template-columns: 1fr">
  <section class="auth-panel">
    <form class="auth-form" id="pwForm" novalidate>
      <h2>Change password</h2>
      <p class="auth-sub">Choose a new password for your account.</p>
      <p class="auth-notice" id="forcedNotice" hidden>You need to set a new password before you can use the dashboard.</p>

      <div class="field">
        <label for="currentPassword">Current password</label>
        <input type="password" id="currentPassword" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="confirmPassword">Repeat new password</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" required>
      </div>
      <p class="auth-sub" style="margin: -4px 0 14px; font-size: 13px">At least 10 characters, with letters and a number.</p>

      <div class="error-text" id="errorText" role="alert" aria-live="polite"></div>
      <button type="submit" class="submit" id="pwButton">Save new password</button>

      <p class="server-status"><a href="index.html" id="cancelLink">Cancel</a><a href="#" id="signOut" style="margin-left: 16px">Sign out</a></p>
    </form>
  </section>
</main>
<script src="js/api.js"></script>
<script src="js/change-password.js"></script>
</body>
</html>
