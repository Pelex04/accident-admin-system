<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login - Accident Detection System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <h1><span class="accent">Accident Detection</span> Admin</h1>
    <div class="form-row">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="admin@accidentdetection.local">
    </div>
    <div class="form-row">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password">
    </div>
    <div class="error-text" id="errorText"></div>
    <button class="btn" id="loginButton" style="width: 100%">Log in</button>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
